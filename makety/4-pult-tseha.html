<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#16181B">
<title>Пульт цеха · макет 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,400..700&family=Onest:wght@400;500;600&family=Tektur:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Рамка показа макета: нейтральная сцена, телефон, панель описания. Одинакова у всех 4 макетов. */
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body.stage{margin:0;min-height:100vh;background:#E6E3DC;color:#24211C;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;gap:40px;align-items:flex-start;justify-content:center;padding:28px 28px 40px;box-sizing:border-box}
.stage *{box-sizing:border-box}
.stage-main{display:flex;flex-direction:column;align-items:center;gap:14px;flex:0 0 auto;position:sticky;top:20px}
#switch{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid #D2CEC4;border-radius:999px;padding:5px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
#switch .sw-l{padding:0 8px 0 10px;color:#7A756A;font-size:12px}
#switch button{font:inherit;border:0;background:transparent;color:#3C382F;padding:7px 12px;border-radius:999px;cursor:pointer;min-height:32px}
#switch button.on{background:#24211C;color:#fff}
#switch .sw-sep{width:1px;height:20px;background:#D2CEC4;margin:0 2px}
#switch .sw-demo{color:#6B665B}
#switch button:focus-visible{outline:2px solid #24211C;outline-offset:2px}
.device{container-type:inline-size;width:390px;height:844px;transition:width .2s,height .2s;border-radius:48px;border:11px solid #1B1A18;background:#000;overflow:hidden;position:relative;transform:translateZ(0);box-shadow:0 30px 60px -20px rgba(40,30,10,.45),0 0 0 1px #3a3833 inset;flex:0 0 auto}
.device>.scroller{height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.device>.scroller::-webkit-scrollbar{display:none}
#panel{width:380px;max-width:100%;font-size:14px;line-height:1.5;padding-top:6px}
#panel .pn-back{display:inline-block;color:#6B665B;text-decoration:none;font-size:13px;margin-bottom:18px}
#panel .pn-back:hover{color:#24211C}
#panel .pn-kick{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8A8477}
#panel .pn-h{font-size:30px;line-height:1.1;margin:6px 0 8px;font-weight:700;letter-spacing:-.01em}
#panel .pn-tag{font-size:16px;color:#4A463D;margin:0 0 16px}
#panel h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#8A8477;margin:22px 0 6px;font-weight:600}
#panel p{margin:0}
#panel ul{margin:0;padding-left:18px}
#panel li{margin:3px 0}
#panel .pn-facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
#panel .pn-facts div{background:#F3F1EC;border:1px solid #DAD6CC;border-radius:10px;padding:8px 10px}
#panel .pn-facts dt{font-size:11px;color:#8A8477;text-transform:uppercase;letter-spacing:.06em}
#panel .pn-facts dd{margin:2px 0 0;font-weight:600;font-size:13px}
#panel .pn-sw{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#panel .pn-cl{display:flex;flex-direction:column;align-items:stretch;gap:2px;font-size:11.5px}
#panel .pn-cl i{display:block;height:34px;border-radius:8px;border:1px solid rgba(0,0,0,.12)}
#panel .pn-cl b{font-weight:600;line-height:1.2;margin-top:3px}
#panel .pn-cl code{color:#7A756A;font-size:11px}
#panel .pn-fonts{list-style:none;padding:0}
#panel .pn-fonts li{display:flex;flex-direction:column;border-bottom:1px solid #DAD6CC;padding:6px 0}
#panel .pn-fonts span{font-size:20px;line-height:1.25}
#panel .pn-fonts small{color:#7A756A}
#panel .pn-refs small{display:block;color:#8A8477;font-size:12px}
#panel a{color:#5A4413}
#panel .pn-note{margin-top:22px;font-size:12.5px;color:#7A756A;background:#F3F1EC;border-radius:10px;padding:10px 12px;border:1px dashed #CFCABF}
@media (max-width:860px){
  body.stage{display:block;padding:0;background:#E6E3DC}
  .stage-main{position:static;display:block}
  #switch .sw-l{display:none}
  #switch button{padding:7px 10px}
  #switch{border-radius:0;border-width:0 0 1px;justify-content:center;flex-wrap:wrap;padding:4px}
  .device{width:100%;height:auto;border:0;border-radius:0;box-shadow:none;transform:none;overflow:visible;background:transparent}
  .device>.scroller{height:auto;overflow:visible}
  #panel{width:auto;padding:24px 16px 48px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.is-preview #switch,.is-preview #panel{display:none!important}
.is-preview body.stage{padding:0;display:block}
.is-preview .device{width:100%;height:auto;border:0;border-radius:0;box-shadow:none;transform:none;overflow:visible}
.is-preview .device>.scroller{height:auto;overflow:visible}
html.is-preview{scrollbar-width:none;overflow:hidden}
html.is-preview::-webkit-scrollbar{display:none}
.device.desk{width:min(1180px,calc(100vw - 460px));height:min(840px,82vh);border-radius:18px;border-width:9px}
#switch .sw-dev[aria-pressed="true"]{background:#EFEBE2;color:#24211C;box-shadow:inset 0 0 0 1px #C8C2B5}
@media (max-width:860px){.device.desk{width:100%;height:auto;border:0;border-radius:0}}

/* ===== Макет 4 «Пульт цеха» ===== */
.app{
  --bg:#16181B;--panel:#202328;--field:#2A2E34;--seam:#3A3F46;--txt:#ECEEF0;--scale:#9AA1AA;--mount:#8C939A;
  --acc:#D0A85C;--acc-on:#16181B;--brand:#B08D4F;--ok:#4CC38A;--dev:#FF8A3D;--alarm:#FF6B6B;--ok-bg:rgba(76,195,138,.13);--dev-bg:rgba(255,138,61,.13);
  font-family:'Onest',system-ui,sans-serif;color:var(--txt);background:var(--bg);font-size:15px;line-height:1.35;min-height:100%;
}
.app[data-shift="night"]{--acc:#8FA8C4;--acc-on:#0F1215}
.app.bright{--bg:#EEF0F2;--panel:#FFFFFF;--field:#F3F4F6;--seam:#C9CED5;--txt:#101214;--scale:#4A525B;--mount:#7C858F;--acc:#8A6A2F;--acc-on:#FFFFFF;--ok:#1E7F4F;--dev:#B45309;--alarm:#C62828;--ok-bg:#E3F3EA;--dev-bg:#FDEEDC}
.app.bright[data-shift="night"]{--acc:#2F4E6E}
.app *{box-sizing:border-box}
.app button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.app .ic{width:20px;height:20px;flex:0 0 auto}
.num{font-family:'Martian Mono',ui-monospace,monospace;font-stretch:87.5%;font-variant-numeric:tabular-nums}
.code{font-family:'Tektur',sans-serif;font-weight:500;letter-spacing:.06em;text-transform:uppercase}

/* шапка с хребтом */
.hd{background:#101215;color:#ECEEF0;padding:14px 16px 0;position:relative}
.app.bright .hd{background:#1B1E22}
.hd-r{display:flex;align-items:center;gap:10px}
.hd-r img{width:40px;height:auto}
.hd-r h1{margin:0;flex:1;font-family:'Tektur',sans-serif;font-weight:600;font-size:19px;letter-spacing:.08em;text-transform:uppercase;line-height:1.1}
.hd-r h1 small{display:block;font-family:'Onest',sans-serif;font-weight:500;letter-spacing:0;text-transform:none;font-size:12.5px;color:#9AA1AA;margin-top:2px}
.bright-b{width:44px;height:44px;border-radius:12px;border:1px solid #3A3F46;background:none;color:#ECEEF0!important;display:flex;align-items:center;justify-content:center}
.bright-b[aria-pressed="true"]{background:#ECEEF0;color:#101215!important}
.ridge{display:block;width:100%;height:78px;margin-top:6px}
.ridge .pk{cursor:pointer}
.ridge text{font-family:'Martian Mono',monospace;font-size:10px;fill:#9AA1AA}
.shiftline{height:4px;background:var(--acc);transition:background .25s}

.wrap{padding:12px 14px 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{min-height:52px;border:1px solid var(--seam);border-radius:12px;background:var(--panel);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-family:'Tektur',sans-serif;letter-spacing:.06em;text-transform:uppercase;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.pnl{background:var(--panel);border:1px solid var(--seam);border-radius:14px;padding:12px 12px 14px;margin-bottom:10px}
.pnl-t{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--scale);margin-bottom:8px}
.pnl-t .code{font-size:12px;color:var(--txt)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:46px;padding:5px 12px;border-radius:10px;border:1px solid var(--seam);background:var(--field);display:inline-flex;align-items:center;gap:7px;line-height:1.15;text-align:left;font-size:14.5px}
.chip small{display:block;font-size:11px;color:var(--scale)}
.chip[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.chip[aria-pressed="true"] small{color:var(--acc)}
.selwrap{position:relative;display:inline-flex}
.selwrap select{appearance:none;-webkit-appearance:none;min-height:46px;border-radius:10px;border:1px dashed var(--seam);background:var(--field);color:var(--txt);font:inherit;font-size:14.5px;padding:0 32px 0 12px}
.selwrap .ic{position:absolute;right:9px;top:13px;pointer-events:none;width:18px;height:18px;color:var(--scale)}
.selwrap.on select{border-style:solid;border-color:var(--acc)}
.fix{font-size:12.5px;color:var(--scale);margin-top:8px}
.fix b{color:var(--txt)}
.lab{display:block;font-size:12px;color:var(--scale);margin:10px 0 6px}

/* плитки пульта */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tile{position:relative;min-height:104px;border-radius:14px;border:1px solid var(--seam);background:var(--panel);padding:10px 12px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;transition:transform .08s}
.tile:active{transform:translateY(2px)}
.tile .top{display:flex;justify-content:space-between;align-items:center}
.tile .top .code{font-size:13px}
.led{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--scale)}
.led i{width:8px;height:8px;border-radius:50%;background:var(--seam)}
.tile.done .led i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.tile.progress .led i{background:var(--dev);box-shadow:0 0 0 3px var(--dev-bg)}
.tile.done{border-color:color-mix(in srgb,var(--ok) 45%,var(--seam))}
.tile .srt{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;margin-top:6px}
.tile .val{font-size:18px;margin-top:2px}
.tile .val small{font-family:'Onest',sans-serif;font-size:12px;color:var(--scale);margin-left:3px}
.tile .empty{font-size:13px;color:var(--scale)}
.tile.sum{background:transparent;border-style:dashed}
.tile.wide{grid-column:1/-1;min-height:64px;flex-direction:row;align-items:center;gap:10px;justify-content:flex-start}
.dm{width:9px;height:9px;transform:rotate(45deg);display:inline-block;flex:0 0 auto;border-radius:1px}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.totals div{border:1px solid var(--seam);border-radius:14px;padding:10px 12px;background:var(--panel)}
.totals small{display:block;font-size:11px;color:var(--scale)}
.totals b{font-size:28px;font-weight:600;color:var(--acc)}
.totals b span{font-family:'Onest',sans-serif;font-size:12px;color:var(--scale);font-weight:400;margin-left:3px}

/* нижняя панель */
.bar{position:sticky;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--seam);padding:10px 14px calc(12px + env(safe-area-inset-bottom))}
.need{font-size:12.5px;color:var(--scale);display:flex;align-items:center;gap:6px;margin-bottom:8px;min-height:18px}
.need .ic{width:15px;height:15px;color:var(--dev)}
.need.ok .ic{color:var(--ok)}
.brow{display:flex;gap:8px}
.tg{width:92px;min-height:60px;border-radius:14px;border:1px solid var(--seam);background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;line-height:1.15;color:var(--scale);padding:0 6px;text-align:center}
.tg .ic{width:20px;height:20px}
.tg[aria-checked="true"]{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.go{flex:1;min-height:60px;border:0;border-radius:14px;background:var(--acc);color:var(--acc-on)!important;font-family:'Tektur',sans-serif;font-weight:600;font-size:16px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px}
.go:active{transform:translateY(2px)}
.err{display:none;margin:0 14px 8px;padding:10px 12px;border-radius:12px;background:rgba(255,92,92,.14);color:var(--alarm);font-size:13.5px;align-items:center;gap:8px}
.err.on{display:flex}
.sentp{display:none;align-items:center;gap:8px;border:1px solid var(--ok);background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:10px}
#root.sent #sentp{display:flex}
#root.sent #bar{display:none}
#root.sent [data-screen=brew] .tile,#root.sent [data-screen=brew] .pnl{pointer-events:none;opacity:.6}

/* лист ввода */
.sheet{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;background:var(--bg)}
.sheet.on{display:flex;animation:sup .2s ease-out}
@keyframes sup{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.sh-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--seam);background:var(--panel)}
.sh-h .t{flex:1;min-width:0}
.sh-h .t .code{font-size:17px;display:block}
.sh-h .t small{color:var(--scale);font-size:12.5px;display:flex;align-items:center;gap:6px}
.x{width:46px;height:46px;border-radius:12px;border:1px solid var(--seam);background:var(--field);display:flex;align-items:center;justify-content:center}
.sh-b{flex:1;overflow-y:auto;padding:12px 14px 16px}
.sh-f{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--seam);display:flex;gap:8px}
.sorts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.sorts .chip{min-height:56px;flex-direction:column;align-items:flex-start;justify-content:center;gap:3px;font-size:13px;padding:6px 9px}
.sorts .chip .dm{margin-bottom:1px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.inp{position:relative}
.inp input{width:100%;min-height:58px;border-radius:12px;border:1px solid var(--seam);background:var(--field);color:var(--txt);font-family:'Martian Mono',monospace;font-stretch:87.5%;font-size:20px;padding:0 34px 0 12px;outline:none}
.inp input::placeholder{color:var(--seam)}
.inp input:focus{border-color:var(--acc);box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 30%,transparent)}
.inp .u{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--scale);font-size:12.5px;pointer-events:none}
.hint{font-size:12.5px;color:var(--scale);display:flex;gap:6px;align-items:flex-start;margin-top:8px}
.hint .ic{width:15px;height:15px;margin-top:1px}
.mt{margin-top:14px;border:1px solid var(--seam);border-radius:14px;overflow:hidden;background:var(--panel)}
.mt-h{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--field);border-bottom:1px solid var(--seam)}
.mt-h .ic{width:18px;height:18px;color:var(--brand)}
.mt-h .code{flex:1;font-size:12.5px}
.mt-h .num{font-size:13px;color:var(--acc)}
.cols{display:grid;grid-template-columns:1fr 50px 92px 54px;gap:6px;padding:6px 12px 2px;font-size:10.5px;color:var(--scale);text-transform:uppercase;letter-spacing:.06em}
.cols span:nth-child(2),.cols span:nth-child(4){text-align:right}
.mr{display:grid;grid-template-columns:1fr 50px 92px 54px;gap:6px;align-items:center;padding:6px 12px;border-top:1px solid var(--seam)}
.mr:first-of-type{border-top:0}
.mr .nm{font-size:13.5px;font-weight:500;line-height:1.2}
.mr .nr{font-size:12.5px;color:var(--scale);text-align:right}
.mr .inp input{min-height:48px;font-size:16px;text-align:right;padding:0 10px}
.mr .dv{font-size:11px;white-space:nowrap;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:1px;line-height:1.1}
.mr .dv .ic{width:16px;height:16px}
.mr.ok .dv{color:var(--ok)}
.mr.ed .dv{color:var(--acc)}
.mr.warn .dv{color:var(--dev)}
.mr.warn{box-shadow:inset 3px 0 0 var(--dev)}
.mr.warn .inp input{border-color:var(--dev)}
.rv{border:0;background:none;color:inherit;font-size:10.5px;text-decoration:underline;padding:0;min-height:22px}
.more{margin-top:10px;width:100%;min-height:44px;border:1px dashed var(--seam);border-radius:12px;background:none;color:var(--scale);font-size:13.5px}
.gh{flex:1;min-height:56px;border-radius:14px;border:1px solid var(--seam);background:var(--panel);display:flex;align-items:center;justify-content:center;gap:6px;font-family:'Tektur',sans-serif;letter-spacing:.06em;text-transform:uppercase;font-size:13.5px}
.gh[disabled]{opacity:.35}
.sr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--seam)}
.sr .code{font-size:14px;color:var(--acc)}
.sr .t small{display:block;color:var(--scale);font-size:12px}
.sr button{border:0;background:none;color:var(--acc);text-decoration:underline;text-underline-offset:3px;min-height:44px}
.stots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.stots div{border:1px solid var(--seam);border-radius:12px;padding:8px 10px;font-size:11px;color:var(--scale)}
.stots b{display:block;font-size:15px;color:var(--txt)}

/* экран успеха */
.okscr{position:fixed;inset:0;z-index:90;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:#101215;color:#ECEEF0}
.okscr.on{display:flex}
.okscr img{width:230px;max-width:66%;height:auto}
.okscr .chk{width:64px;height:64px;border-radius:50%;background:#4CC38A;color:#101215;display:flex;align-items:center;justify-content:center;margin-top:-10px;box-shadow:0 0 0 8px rgba(76,195,138,.18);animation:pop .35s cubic-bezier(.2,1.5,.4,1) both .1s}
.okscr .chk .ic{width:34px;height:34px;stroke-width:2.6}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.okscr h3{margin:14px 0 4px;font-family:'Tektur',sans-serif;font-weight:600;font-size:22px;letter-spacing:.1em;text-transform:uppercase}
.okscr .m{font-size:14px;color:#9AA1AA;line-height:1.7}
.okscr .m b{color:#ECEEF0;font-family:'Martian Mono',monospace;font-stretch:87.5%;font-weight:500}
.okscr .n2{margin-top:10px;font-size:12.5px;color:#7C848D;max-width:290px}
.okscr button{margin-top:18px;min-height:50px;padding:0 24px;border-radius:12px;border:1px solid #3A3F46;background:none;color:#ECEEF0}

/* розлив */
.tanks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tanks .chip{justify-content:center;padding:0;font-family:'Martian Mono',monospace;font-stretch:87.5%}
.bigsel{position:relative}
.bigsel select{appearance:none;-webkit-appearance:none;width:100%;min-height:56px;border-radius:12px;border:1px solid var(--seam);background:var(--field);color:var(--txt);font:inherit;font-size:16px;padding:0 40px 0 12px}
.bigsel .ic{position:absolute;right:12px;top:18px;pointer-events:none;color:var(--scale)}
.kg{border:1px solid var(--seam);border-radius:14px;padding:10px 12px;margin-top:10px;background:var(--panel)}
.kg .l{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--scale);margin-bottom:8px}
.kg .l .code{color:var(--txt);font-size:14px;display:flex;align-items:center;gap:6px}
.kg .l .code .ic{color:var(--brand)}
.stp{display:grid;grid-template-columns:64px 1fr 64px;gap:6px}
.stp button{height:64px;border-radius:12px;border:1px solid var(--seam);background:var(--field);display:flex;align-items:center;justify-content:center}
.stp button .ic{width:26px;height:26px}
.stp button:active{transform:translateY(2px)}
.stp input{height:64px;border-radius:12px;border:1px solid var(--seam);background:var(--bg);color:var(--txt);text-align:center;font-family:'Martian Mono',monospace;font-stretch:87.5%;font-size:30px;font-weight:600;outline:none;min-width:0}
.qk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.qk button{min-height:42px;border-radius:10px;border:1px solid var(--seam);background:none;font-family:'Martian Mono',monospace;font-stretch:87.5%;font-size:14px;color:var(--scale)}
.app :focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body class="stage">
<main class="stage-main">
  <div id="switch"></div>
  <div class="device"><div class="scroller" id="app">
  <div class="app" id="root" data-shift="day">

    <section data-screen="brew" data-title="Варочный цех">
      <header class="hd">
        <div class="hd-r"><img data-img="hop" alt="Благовар"><h1>Варочный цех<small>Пивовар смены · Гильмуллин Э.</small></h1><button type="button" class="bright-b" data-act="bright" aria-pressed="false" aria-label="Яркий свет"></button></div>
        <svg class="ridge" id="ridge" viewBox="0 0 360 78" aria-label="Варки смены"></svg>
      </header>
      <div class="shiftline"></div>
      <div class="wrap">
        <div class="sentp" id="sentp"></div>
        <div class="seg" role="group" aria-label="Смена"><button type="button" data-act="shift" data-v="day"></button><button type="button" data-act="shift" data-v="night"></button></div>
        <div class="pnl">
          <div class="pnl-t"><span class="code">Дата смены</span><span id="dateShort"></span></div>
          <div class="chips" id="dateChips"></div><div class="fix" id="dateFix"></div>
          <span class="lab">Помощник / ученик</span><div class="chips" id="helpers"></div>
        </div>
        <div class="tiles" id="tiles"></div>
      </div>
      <div class="err" id="err"></div>
      <div class="bar" id="bar"></div>
    </section>

    <section data-screen="rozliv" data-title="Розлив" hidden>
      <header class="hd">
        <div class="hd-r"><img data-img="hop" alt="Благовар"><h1>Розлив<small>Оператор розлива · Сурков Д.</small></h1><button type="button" class="bright-b" data-act="bright" aria-pressed="false" aria-label="Яркий свет"></button></div>
        <svg class="ridge" id="rRidge" viewBox="0 0 360 78" aria-hidden="true"></svg>
      </header>
      <div class="shiftline"></div>
      <div class="wrap">
        <div class="sentp" id="rSentp" style="display:none"></div>
        <div class="seg" role="group" aria-label="Смена"><button type="button" data-act="shift" data-v="day"></button><button type="button" data-act="shift" data-v="night"></button></div>
        <div class="pnl"><div class="pnl-t"><span class="code">Дата смены</span></div><div class="chips" id="rDateChips"></div><div class="fix" id="rDateFix"></div></div>
        <div class="totals" id="ktot"></div>
        <div class="tiles" id="rTiles"></div>
      </div>
      <div class="err" id="rErr"></div>
      <div class="bar" id="rBar"></div>
    </section>

    <div class="sheet" id="sheet"></div>
    <div class="okscr" id="ok"></div>
  </div>
  </div></div>
</main>

  $('rBar').hidden=!!R.sent;
  $('rBar').innerHTML='<div class="brow"><button type="button" class="tg" role="switch" data-act="rdone" aria-checked="'+R.done+'">'+I(R.done?'lock':'check')+(R.done?'смена завершена':'завершить смену')+'</button><button type="button" class="go" data-act="rsend">Отправить розлив'+I('arrowR')+'</button></div>';
}

function renderAll(){ renderShift(); dateChips('dateChips','dateFix',S.day,'day'); $('dateShort').textContent=S.day?B.dateLabel(S.day):''; renderHelpers(); renderRidge(); renderTiles(); renderBar(); renderRoz(); root.classList.toggle('sent',!!S.sent); }

root.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t||t.tagName==='SELECT'||t.tagName==='INPUT') return;
  var a=t.getAttribute('data-act'), v=t.getAttribute('data-v'), sh=S.sheet, b=sh&&sh.kind==='brew'?S.brews[sh.i]:null;
  if(a==='shift'){S.shift=v; renderAll()}
  else if(a==='bright'){S.bright=!S.bright; renderShift()}
  else if(a==='day'){S.day=+v; err('err',''); renderAll()}
  else if(a==='rday'){S.roz.day=+v; renderRoz()}
  else if(a==='vday'){S.vol.day=+v; dateChips('vDateChips','vDateFix',S.vol.day,'vday')}
  else if(a==='vtarget'){S.vol.target=v; openSheet('vol')}
  else if(a==='helper'){S.helper=v; renderHelpers()}
  else if(a==='open'){ if(S.sent) return; openSheet('brew',+v) }
  else if(a==='summary'){ openSheet('sum') }
  else if(a==='vol'){ openSheet('vol') }
  else if(a==='closesheet'){ closeSheet() }
  else if(a==='sort'){ B.setSort(b,v); B.vibrate(); openSheet('brew',sh.i); document.querySelector('#sheet .sh-b').scrollTop=0 }
  else if(a==='revert'){ var k=t.getAttribute('data-k'); b.mats[k]=B.normStr(B.R[b.sort][k]); var q=document.querySelector('#sheet input[data-k="'+k+'"]'); if(q) q.value=b.mats[k]; refreshRow(k) }
  else if(a==='extra'){ b.extra=true; var st=document.querySelector('#sheet .sh-b').scrollTop; openSheet('brew',sh.i); document.querySelector('#sheet .sh-b').scrollTop=st }
  else if(a==='done'){ S.done=!S.done; renderBar() }
  else if(a==='send'){ send() }
  else if(a==='closeok'){ $('ok').classList.remove('on') }
  else if(a==='sendvol'){
    if(!S.vol.day){alertIn('Укажите дату прошлой смены');return} if(!S.vol.a||!S.vol.b){alertIn('Введите объём обеих варок');return}
    S.vol.sent=B.nowHM(); closeSheet(); var a1=S.vol.target==='day'?4:9;
    success('Смена закрыта','объёмы варок <b>'+B.pad(a1)+'-'+B.pad(a1+1)+'</b> добавлены в <b>'+S.vol.sent+'</b>','Макет: данные никуда не ушли.');
  }
  else if(a==='pos'){ if(S.roz.sent) return; openSheet('pos',+v) }
  else if(a==='addpos'){ S.roz.pos.push(B.emptyPos()); renderRoz(); openSheet('pos',S.roz.pos.length-1) }
  else if(a==='rtank'){ S.roz.pos[sh.i].tank=v; B.vibrate(); openSheet('pos',sh.i) }
  else if(a==='rstep'||a==='rzero'){ var p=S.roz.pos[sh.i], k2=t.getAttribute('data-k'); p[k2]= a==='rzero'?0:Math.max(0,(+p[k2]||0)+(+v)); var q2=document.querySelector('#sheet input[data-k="'+k2+'"]'); if(q2) q2.value=p[k2]; B.vibrate(); var sm=document.querySelector('#sheet .sh-h small'); if(sm) sm.textContent=B.posSummary(p) }
  else if(a==='rdone'){ S.roz.done=!S.roz.done; renderRoz() }
  else if(a==='rsend'){
    if(!S.roz.day){err('rErr','Выберите дату смены');return}
    if(!S.roz.pos.some(function(p){return B.posStatus(p)==='done'})){err('rErr','Заполните хотя бы одну позицию: сорт, ёмкость и кеги');return}
    err('rErr',''); S.roz.sent=B.nowHM(); renderRoz(); var a50=0,a30=0; S.roz.pos.forEach(function(p){a50+=+p.k50||0; a30+=+p.k30||0});
    success('Розлив принят','кеги 50 л: <b>'+a50+'</b> · кеги 30 л: <b>'+a30+'</b><br>отправлено в <b>'+S.roz.sent+'</b> · оператор Сурков Д.','Макет: данные никуда не ушли.');
  }
});
function alertIn(m){ var f=document.querySelector('#sheet .sh-f'); var e=document.createElement('div'); e.className='err on'; e.style.margin='0 0 8px'; e.innerHTML=I('warn')+m; var old=document.querySelector('#sheet .sh-b .err'); if(old) old.remove(); document.querySelector('#sheet .sh-b').appendChild(e); }
root.addEventListener('change',function(e){
  var t=e.target, a=t.getAttribute('data-act');
  if(a==='day'&&t.value){S.day=+t.value; renderAll()}
  if(a==='rday'&&t.value){S.roz.day=+t.value; renderRoz()}
  if(a==='vday'&&t.value){S.vol.day=+t.value; dateChips('vDateChips','vDateFix',S.vol.day,'vday')}
  if(a==='rsort'){S.roz.pos[S.sheet.i].sort=t.value; var sm=document.querySelector('#sheet .sh-h small'); if(sm) sm.textContent=B.posSummary(S.roz.pos[S.sheet.i])}
});
root.addEventListener('input',function(e){
  var t=e.target, a=t.getAttribute('data-act'), sh=S.sheet;
  if(a==='mat'){S.brews[sh.i].mats[t.getAttribute('data-k')]=t.value; refreshRow(t.getAttribute('data-k')); refreshHead()}
  else if(a==='ckt'){S.brews[sh.i].ckt=t.value; refreshHead()}
  else if(a==='vol'){S.brews[sh.i].vol=t.value; refreshHead()}
  else if(a==='va'){S.vol.a=t.value} else if(a==='vb'){S.vol.b=t.value}
  else if(a==='rk'){S.roz.pos[sh.i][t.getAttribute('data-k')]=+t.value||0}
});
B.bindNumericInputs(root);

  pros:['Одна механика на все 14 форм: плитки блоков, лист ввода, отправка','Отклонение от рецептуры видно в момент ввода, это полезно технологу','Для фильтрации с 10 партиями плитки компактнее длинной ленты','Режим «яркий свет» одним касанием для двора и отгрузки'],

},{demo:function(){S=fresh(true); $('sheet').classList.remove('on'); $('ok').classList.remove('on'); renderAll()}, clear:function(){S=fresh(false); $('sheet').classList.remove('on'); $('ok').classList.remove('on'); renderAll()}});
