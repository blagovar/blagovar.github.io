<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1A140E">
<meta name="robots" content="noindex,nofollow">
<title>Варочный цех · Гринько М. · Благовар</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231A140E'/%3E%3Ctext x='16' y='23' font-family='Georgia' font-size='19' font-weight='bold' fill='%23B08D4F' text-anchor='middle'%3E%D0%91%3C/text%3E%3C/svg%3E">
<style>
/* Формы «Благовар» v21, оформление «Стаут и медь». Один файл на все 14 форм. */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{
  --bg:#F4EFE4;--paper:#FFFDF8;--ink:#2A2119;--ink2:#6B5D4F;--line:#E3D9C7;--line2:#CDBFA6;
  --stout:#1A140E;--gold:#B08D4F;--copper:#9A5B25;--copper-on:#FFF8EE;--copper-l:#B87333;--copper-t:#8C4F1E;
  --hop:#5E7B3A;--hop-bg:#EEF2E4;--amber:#A86E0C;--amber-bg:#FBF0D9;--err:#B3261E;--field:#FFFFFF;--chip:#F7F1E5;
  --shadow:0 1px 0 rgba(42,33,25,.04),0 6px 18px -12px rgba(42,33,25,.35);
  font-family:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--bg);
  font-size:15px;line-height:1.4;min-height:100vh;transition:background-color .25s,color .25s;
}
body[data-shift="night"]{
  --bg:#17110C;--paper:#241B13;--ink:#F1E6D2;--ink2:#B7A58B;--line:#3A2D21;--line2:#54422F;
  --copper:#D9A35F;--copper-on:#1A140E;--copper-l:#C98A4B;--copper-t:#E3B272;--hop:#A9C585;--hop-bg:#26301D;
  --amber:#F0B650;--amber-bg:#3A2C12;--err:#FF8A78;--field:#1C150F;--chip:#2C2218;--shadow:0 8px 20px -14px rgba(0,0,0,.8);
}
button{font:inherit;color:inherit;cursor:pointer}
.ic{width:20px;height:20px;flex:0 0 auto}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lbl{font-family:'Oswald',sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.12em}
:focus-visible{outline:2.5px solid var(--copper-l);outline-offset:2px}

/* шапка-этикетка */
.label{background:var(--stout);color:#F2EAD9;text-align:center;padding:18px 16px 0;position:relative;overflow:hidden}
.label::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(176,141,79,.05) 0 1px,transparent 1px 7px);pointer-events:none}
.label img{width:60px;height:auto;display:block;margin:0 auto 6px;position:relative}
.label h1{margin:0;font-family:'Oswald',sans-serif;font-weight:500;font-size:21px;letter-spacing:.16em;padding-left:.16em;text-transform:uppercase;position:relative;line-height:1.15}
.label .sub{font-size:11px;letter-spacing:.24em;padding-left:.24em;text-transform:uppercase;color:var(--gold);margin-top:4px;position:relative}
.label .orn{display:block;width:100%;height:18px;margin-top:12px;position:relative}
.who{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:#CDBB9A;padding:8px 0 12px;position:relative}
.who .ic{width:16px;height:16px;color:var(--gold)}

.wrap{padding:14px 16px 16px;max-width:760px;margin:0 auto}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.seg button{min-height:56px;border-radius:14px;border:1.5px solid var(--line2);background:var(--paper);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;transition:background .2s,border-color .2s}
.seg button[aria-pressed="true"]{background:var(--stout);border-color:var(--stout);color:#F2EAD9}
body[data-shift="night"] .seg button[aria-pressed="true"]{background:var(--copper);border-color:var(--copper);color:var(--copper-on)}
.seg button[aria-pressed="true"] .ic{color:var(--gold)}
body[data-shift="night"] .seg button[aria-pressed="true"] .ic{color:var(--copper-on)}
.tabs2{display:flex;border-bottom:1px solid var(--line2);margin:6px 0 14px}
.tabs2 button{flex:1;background:none;border:0;min-height:44px;font-size:14px;color:var(--ink2);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tabs2 button[aria-pressed="true"]{color:var(--ink);border-color:var(--copper);font-weight:600}

.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h .lbl{font-size:14px}
.field-l{display:block;font-size:13px;color:var(--ink2);margin:12px 0 6px}
.field-l:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:6px 14px;border-radius:12px;border:1.5px solid var(--line2);background:var(--chip);font-size:15px;display:inline-flex;align-items:center;gap:6px;line-height:1.15;text-align:left}
.chip small{display:block;font-size:11.5px;color:var(--ink2)}
.chip[aria-pressed="true"]{border-color:var(--copper-l);background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--copper-l)}
.chip[aria-pressed="true"] small{color:var(--copper-t)}
.selwrap{position:relative;display:inline-flex}
.selwrap select,.selwrap input[type=date]{appearance:none;-webkit-appearance:none;min-height:48px;border-radius:12px;border:1.5px dashed var(--line2);background:var(--chip);color:var(--ink);font:inherit;font-size:15px;padding:0 34px 0 14px}
.selwrap .ic{position:absolute;right:10px;top:14px;pointer-events:none;width:18px;height:18px;color:var(--ink2)}
.selwrap.on select,.selwrap.on input[type=date]{border-style:solid;border-color:var(--copper-l);box-shadow:inset 0 0 0 1.5px var(--copper-l)}
.datefix{margin-top:10px;font-size:13px;color:var(--ink2)}
.datefix b{color:var(--ink);font-weight:600}

/* номера варок */
.nums{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 16px;margin:0 -16px 8px;border-bottom:1px solid var(--line);transition:background .25s}
.nums-t{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);margin-bottom:8px}
.nums-row{display:flex;justify-content:space-between;gap:4px}
.num{width:58px;height:58px;border-radius:50%;border:1.5px solid var(--line2);background:var(--paper);position:relative;font-family:'Oswald',sans-serif;font-size:22px;font-weight:500;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.num:active{transform:scale(.96)}
.num.done{border-color:var(--copper-l)}
.num.cur{background:var(--stout);border-color:var(--stout);color:#F2EAD9}
body[data-shift="night"] .num.cur{background:var(--copper);border-color:var(--copper);color:var(--copper-on)}
.num .bd{position:absolute;right:-2px;top:-2px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.num .bd .ic{width:12px;height:12px;stroke-width:2.6}
.num.done .bd{background:var(--hop);color:#fff}
.num.progress .bd{background:var(--amber);color:#fff}

.brew .card-h h2{margin:0;font-family:'Oswald',sans-serif;font-weight:500;font-size:24px;letter-spacing:.06em;text-transform:uppercase}
.state{font-size:12.5px;display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:var(--chip);color:var(--ink2)}
.state .ic{width:14px;height:14px}
.state.done{background:var(--hop-bg);color:var(--hop)}
.state.progress{background:var(--amber-bg);color:var(--amber)}
.sorts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sorts .chip{min-height:54px;justify-content:flex-start;padding:6px 12px;font-size:14.5px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inp{position:relative}
.inp input{width:100%;min-height:56px;border-radius:12px;border:1.5px solid var(--line2);background:var(--field);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:22px;padding:0 40px 0 14px;font-variant-numeric:tabular-nums;outline:none;transition:border-color .15s,box-shadow .15s}
.inp input::placeholder{color:var(--line2)}
.inp input:focus{border-color:var(--copper-l);box-shadow:0 0 0 3px color-mix(in srgb,var(--copper-l) 22%,transparent)}
.inp .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink2);font-size:14px;pointer-events:none}
.pend{margin-top:8px;font-size:12.5px;color:var(--ink2);display:flex;gap:6px;align-items:flex-start}
.pend .ic{width:16px;height:16px;margin-top:1px}
.orn2{display:flex;align-items:center;gap:8px;margin:18px 0 4px;color:var(--copper-l)}
.orn2::before,.orn2::after{content:"";flex:1;height:1px;background:var(--line2)}
.orn2 i{width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.grp{margin-top:14px}
.grp-h{display:flex;align-items:center;gap:8px;padding:6px 0 8px;border-bottom:1.5px solid var(--ink)}
.grp-h .ic{color:var(--copper-l);width:22px;height:22px}
.grp-h .lbl{font-size:13.5px;flex:1}
.grp-h .tot{font-size:15px;font-weight:600}
.grp-h .tot small{font-family:'Golos Text',sans-serif;font-weight:400;color:var(--ink2);font-size:12px;margin-left:3px}
.mrow{display:grid;grid-template-columns:1fr 128px;gap:10px;align-items:center;padding:9px 0 9px 12px;border-bottom:1px solid var(--line);position:relative}
.mrow::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--hop)}
.mrow.ed::before{background:var(--copper-l)}
.mrow.warn::before{background:var(--amber)}
.mrow.none::before{background:transparent}
.mrow .nm{font-size:15px;line-height:1.2}
.mrow .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);margin-top:3px;flex-wrap:wrap}
.mrow.ed .meta{color:var(--copper-t)}
.mrow.warn .meta{color:var(--amber)}
.mrow .meta .ic{width:13px;height:13px}
.rv{border:0;background:none;padding:2px 4px;margin-left:-2px;color:inherit;display:inline-flex;align-items:center;gap:3px;text-decoration:underline;text-underline-offset:2px;font-size:12px;min-height:28px}
.mrow .inp input{min-height:48px;font-size:19px;padding-right:34px;text-align:right}
.mrow .inp .u{right:10px;font-size:12.5px}
.more{margin-top:10px;width:100%;min-height:44px;border:1.5px dashed var(--line2);border-radius:12px;background:none;color:var(--ink2);font-size:14px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:4px}
.nav button{flex:1;min-height:48px;border-radius:12px;border:1.5px solid var(--line2);background:var(--paper);display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px}
.nav button[disabled]{opacity:.35}
.lockmsg{display:none;align-items:center;gap:8px;font-size:13px;color:var(--ink2);background:var(--chip);border-radius:12px;padding:10px 12px;margin-bottom:12px}
body.locked .lockmsg{display:flex}
body.locked .frozen{pointer-events:none;opacity:.55}
/* тумблер «Смена завершена» остаётся живым: иначе снять отметку нечем */
body.locked .done-card{pointer-events:auto;opacity:1}
body.sent .done-card{pointer-events:none;opacity:.55}

.done-card{display:flex;gap:14px;align-items:center;cursor:pointer;border-style:dashed;border-width:2px;width:100%;text-align:left}
.done-card .tg{width:52px;height:32px;border-radius:99px;background:var(--line2);position:relative;flex:0 0 auto;transition:background .2s}
.done-card .tg::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.done-card[aria-checked="true"]{border-style:solid;border-color:var(--hop);background:var(--hop-bg)}
.done-card[aria-checked="true"] .tg{background:var(--hop)}
.done-card[aria-checked="true"] .tg::after{transform:translateX(20px)}
.done-card b{display:block;font-size:16px}
.done-card small{color:var(--ink2);font-size:12.5px}

.bar{position:sticky;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom));display:flex;gap:12px;align-items:center;max-width:760px;margin:0 auto}
.bar .prog{font-size:12.5px;color:var(--ink2);line-height:1.25;min-width:84px}
.bar .prog b{display:block;font-size:17px;color:var(--ink);font-family:'IBM Plex Mono',monospace}
.go{flex:1;min-height:60px;border:0;border-radius:14px;background:var(--copper);color:var(--copper-on)!important;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 18px -10px var(--copper)}
.go:active{transform:translateY(1px)}
.go[disabled]{opacity:.6}
.err{display:none;margin:0 16px 8px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--err) 12%,var(--paper));color:var(--err);font-size:13.5px;align-items:center;gap:8px;max-width:760px}
.err.on{display:flex}
.sentbar{display:none;align-items:center;gap:8px;background:var(--hop-bg);color:var(--hop);border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px}
.sentbar.on{display:flex}

/* лист проверки и экран «Принято» */
.sheet{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;justify-content:flex-end;background:rgba(26,20,14,.5)}
.sheet.on{display:flex}
.sheet .in{background:var(--paper);color:var(--ink);border-radius:22px 22px 0 0;max-height:86%;overflow:auto;padding:10px 16px calc(16px + env(safe-area-inset-bottom));animation:up .22s ease-out;max-width:760px;width:100%;margin:0 auto}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-family:'Oswald',sans-serif;font-weight:500;font-size:22px;text-transform:uppercase;letter-spacing:.06em}
.sheet .sub{color:var(--ink2);font-size:13px;margin-bottom:12px}
.sum-r{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.sum-r .n{font-family:'Oswald',sans-serif;font-size:20px;color:var(--copper-t);text-align:center}
.sum-r .t{font-size:14.5px}
.sum-r .t small{display:block;color:var(--ink2);font-size:12.5px}
.sum-r button{border:0;background:none;color:var(--copper-t);text-decoration:underline;text-underline-offset:3px;font-size:14px;min-height:44px}
.sum-tot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.sum-tot div{background:var(--chip);border-radius:12px;padding:8px 10px;font-size:11.5px;color:var(--ink2)}
.sum-tot b{display:block;font-family:'IBM Plex Mono',monospace;font-size:16px;color:var(--ink)}
.ok{position:fixed;inset:0;z-index:90;display:none;background:radial-gradient(120% 70% at 50% 28%,#2B2016 0,#1A140E 60%);color:#F2EAD9;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.ok.on{display:flex}
.ok img{width:240px;max-width:70%;height:auto;animation:fade .5s ease-out}
.ok .stamp{margin-top:6px;border:2px solid var(--copper-l);color:#E4B37A;font-family:'Oswald',sans-serif;font-weight:600;font-size:26px;letter-spacing:.2em;text-transform:uppercase;padding:6px 16px 6px 22px;border-radius:6px;transform:rotate(-4deg);animation:stamp .35s cubic-bezier(.2,1.4,.4,1) .15s both}
@keyframes stamp{from{transform:rotate(-4deg) scale(1.6);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ok .meta2{margin-top:16px;font-size:14px;color:#CDBB9A;line-height:1.6}
.ok .meta2 b{color:#F2EAD9;font-family:'IBM Plex Mono',monospace;font-weight:500}
.ok .note{margin-top:14px;font-size:12.5px;color:#9C8B72;max-width:300px}
.ok .close{margin-top:22px;min-height:52px;padding:0 26px;border-radius:12px;border:1.5px solid #54422F;background:transparent;color:#F2EAD9}

/* списки позиций и партий */
.pos{padding:0;overflow:hidden}
.pos-h{display:flex;align-items:center;gap:12px;padding:14px 16px;width:100%;background:none;border:0;text-align:left;min-height:64px}
.pos-h .pn{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--copper-l);display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:17px;color:var(--copper-t);flex:0 0 auto}
.pos-h .pt{flex:1;font-size:15px;font-weight:500;min-width:0}
.pos-h .pt small{display:block;font-weight:400;font-size:12.5px;color:var(--ink2)}
.pos-h .ic{transition:transform .2s;color:var(--ink2)}
.pos.open .pos-h .chev{transform:rotate(180deg)}
.pos-b{display:none;padding:0 16px 16px}
.pos.open .pos-b{display:block}
.bigsel{position:relative}
.bigsel select{appearance:none;-webkit-appearance:none;width:100%;min-height:56px;border-radius:12px;border:1.5px solid var(--line2);background:var(--field);color:var(--ink);font:inherit;font-size:16px;padding:0 40px 0 14px}
.bigsel .ic{position:absolute;right:12px;top:18px;pointer-events:none;color:var(--ink2)}
.tanks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tanks .chip{justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:500;padding:0}
.step{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .sl{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.step .sl .ic{color:var(--copper-l)}
.stp{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.stp button{width:52px;height:52px;border-radius:12px;border:1.5px solid var(--line2);background:var(--chip);display:flex;align-items:center;justify-content:center}
.stp button:active{transform:translateY(1px)}
.stp input{width:72px;height:52px;border-radius:12px;border:1.5px solid var(--line2);background:var(--field);color:var(--ink);text-align:center;font-family:'IBM Plex Mono',monospace;font-size:22px;font-weight:600;outline:none}
.stp input:focus{border-color:var(--copper-l)}
.quick{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.quick button{min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line2);background:none;font-size:13px;color:var(--ink2)}
.add{width:100%;min-height:56px;border:1.5px dashed var(--copper-l);border-radius:14px;background:none;color:var(--copper-t);font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:12px}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.totals div{background:var(--stout);color:#F2EAD9;border-radius:14px;padding:12px 14px}
.totals small{display:block;font-size:12px;color:#CDBB9A}
.totals b{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:600}
.totals b span{font-size:13px;font-family:'Golos Text',sans-serif;font-weight:400;color:#CDBB9A;margin-left:4px}
.ost-h{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;padding:0;min-height:40px;text-align:left}
.ost-h .badge{font-size:11.5px;color:var(--ink2);border:1px solid var(--line2);border-radius:99px;padding:2px 8px;margin-left:6px}
.ost-b{display:none;margin-top:10px}
.ost.open .ost-b{display:block}
.ost.open .ost-h .ic{transform:rotate(180deg)}
.ost-b .sep{font-size:12px;color:var(--ink2);margin:10px 0 6px}

/* приход и отгрузка: на компьютере в две колонки */
.cols{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
.mach{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--chip)}
.mach b{display:block;font-size:13px;color:var(--ink2);margin-bottom:8px;font-weight:600}
.itog{border-top:1.5px solid var(--line2);margin-top:10px;padding-top:8px}
.itog-row{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;font-size:14px}
.itog-row b{font-family:'IBM Plex Mono',monospace;font-size:17px}
.itog.grand{border-top:2px solid var(--copper-l);background:var(--chip);border-radius:0 0 10px 10px;margin:12px -16px -16px;padding:10px 16px 14px}
.itog.grand .itog-row b{font-size:20px;color:var(--copper-t)}
textarea{width:100%;min-height:132px;border-radius:12px;border:1.5px solid var(--line2);background:var(--field);color:var(--ink);font-family:'IBM Plex Mono',monospace;font-size:15px;line-height:1.5;padding:12px;resize:vertical;outline:none}
textarea:focus{border-color:var(--copper-l);box-shadow:0 0 0 3px color-mix(in srgb,var(--copper-l) 20%,transparent)}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn2{flex:1;min-height:52px;border-radius:12px;border:0;background:var(--copper);color:var(--copper-on)!important;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.btn2.ghost{background:none;border:1.5px solid var(--line2);color:var(--ink)!important;flex:0 0 auto;padding:0 16px}
.unknown{display:flex;gap:8px;align-items:flex-start;background:var(--amber-bg);color:var(--amber);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13.5px}
.zrow{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.zrow .zn{font-family:'IBM Plex Mono',monospace;color:var(--copper-t);font-size:15px;padding-top:14px}
.zline{display:grid;grid-template-columns:1fr 96px 46px;gap:8px;align-items:center}
.zline .bigsel select{min-height:50px;font-size:15px}
.zline .inp input{min-height:50px;font-size:18px;text-align:right;padding-right:34px}
.zdel{width:46px;height:50px;border-radius:12px;border:1.5px solid var(--line2);background:none;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.zsub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink2)}
.vol2{display:inline-flex;border:1.5px solid var(--line2);border-radius:10px;overflow:hidden}
.vol2 button{min-height:38px;padding:0 14px;border:0;background:var(--chip);font-size:13.5px;color:var(--ink2)}
.vol2 button+button{border-left:1.5px solid var(--line2)}
.vol2 button.on{background:var(--stout);color:#F2EAD9}
body[data-shift="night"] .vol2 button.on{background:var(--copper);color:var(--copper-on)}
.badge2{font-size:12px;border:1px solid var(--line2);border-radius:99px;padding:3px 10px;color:var(--ink2)}
.badge2.warn{border-color:var(--amber);color:var(--amber);background:var(--amber-bg)}
.emptyz{padding:14px 0;color:var(--ink2);font-size:13.5px;text-align:center}
.grand2{display:flex;gap:16px}
.grand2 div{font-size:12px;color:var(--ink2);line-height:1.2}
.grand2 b{display:block;font-family:'IBM Plex Mono',monospace;font-size:19px;color:var(--ink)}
@media (min-width:860px){
  .wrap{max-width:1100px;padding:20px 24px 24px}
  .bar{max-width:1100px}
  body[data-form="prikhod"] .cols{grid-template-columns:minmax(300px,1fr) minmax(420px,1.35fr);gap:16px}
  body[data-form="prikhod"] .col-l,body[data-form="prikhod"] .col-r{display:flex;flex-direction:column;gap:12px}
  body[data-form="prikhod"] .cols .card{margin-bottom:0}
  body[data-form="prikhod"] .mach{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:12px}
  body[data-form="prikhod"] .mach b{margin:0}
  body[data-form="prikhod"] textarea{min-height:190px;font-size:16px}
  body[data-form="prikhod"] .zline{grid-template-columns:1fr 120px 46px}
  body[data-form="prikhod"] .bar{justify-content:flex-end}
  body[data-form="prikhod"] .go{flex:0 0 auto;padding:0 28px}
  .label h1{font-size:24px}
  .sorts{grid-template-columns:1fr 1fr 1fr}
  .nums-row{justify-content:flex-start;gap:12px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</style>

    setTimeout(function () { if (btn) { btn.disabled = false; } onSuccess(true); }, 300);

  fetch(SURL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: body })

      if (btn) { btn.disabled = false; btn.innerHTML = btn.getAttribute('data-label') || 'Отправить отчёт'; }

  function total() { var t = 0; S.batches.forEach(function (b) { var q = num(b.qty); if (!isNaN(q)) t += q; }); return t; }

      '<div class="inp"><input data-num="dec" inputmode="decimal" enterkeyhint="next" data-act="fmat" data-k="' + k + '" value="' + esc(v) + '" placeholder="0" aria-label="' + name + ', кг"><span class="u">кг</span></div></div>';

            S.sent = nowHM(); redraw(); sentNote('sentbar', S.sent);
            okScreen('Принято', 'Движение кег <b>' + dateLabel(S.day) + '</b><br>Приход: <b>' + machTot('k50') + '</b> × 50 л, <b>' + machTot('k30') + '</b> × 30 л<br>К отгрузке: <b>' + (zTot(50) + oTot(50)) + '</b> × 50 л, <b>' + (zTot(30) + oTot(30)) + '</b> × 30 л<br>Отправлено в <b>' + S.sent + '</b>',
              'Форма закрыта. Если нашли ошибку, обратитесь к руководителю смены.' + (SEND_ENABLED ? '' : ' Это копия для осмотра: данные никуда не ушли.'));
          });
        }
      });
      document.addEventListener('change', function (e) {
        var t = e.target, a = t.getAttribute('data-act'), i = t.hasAttribute('data-i') ? +t.getAttribute('data-i') : -1;
        if (a === 'day' && t.value) { S.day = +t.value; showErr(''); redraw(); }
        if (a === 'zsort') { S.zrows[i].sort = t.value; redraw(); }
        if (a === 'psort') { S.poz[i].sort = t.value; redraw(); }
      });
      document.addEventListener('input', function (e) {
        var t = e.target, a = t.getAttribute('data-act'), i = t.hasAttribute('data-i') ? +t.getAttribute('data-i') : -1;
        if (t.id === 'zinp') { S.order = t.value; return; }
        if (a === 'mach') {
          S.mach[+t.getAttribute('data-i')][t.getAttribute('data-k')] = t.value;
          var e50 = document.querySelector('[data-ptot="50"]'), e30 = document.querySelector('[data-ptot="30"]');
          if (e50) e50.textContent = machTot('k50') + ' шт'; if (e30) e30.textContent = machTot('k30') + ' шт';
          redrawTotals();
        }
        else if (a === 'brak') { S.brak[t.getAttribute('data-k')] = t.value; redrawTotals(); }
        else if (a === 'zqty') { S.zrows[i].qty = parseQty(t.value); redrawTotals(); }
        else if (a === 'pqty') { S.poz[i].qty = t.value; redrawTotals(); }
      });
      window.__state = S; window.__build = { prikhod: build };
    }
  };
};

/* ==================== УТИЛИЗАЦИЯ ДРОБИНЫ ==================== */
MODULES.drobina = function () {
  // форма не блокируется после отправки: можно списать ещё раз, как в v20
  var S = { iso: '', shift: 'day', qty: '', lastSent: null };
  function render() {
    $('app').innerHTML = '<div class="sentbar" id="sentbar"></div>' +
      '<div class="card"><div class="card-h"><span class="lbl">Какую смену списываем</span></div>' +
      '<span class="field-l">Дата смены</span><div class="chips" id="dateChips"></div><div class="datefix" id="dateFix"></div>' +
      '<span class="field-l">Смена</span><div class="chips" id="shiftChips"></div></div>' +
      '<div class="card" id="qtyCard"></div>';
    redraw();
  }
  function dateRow() {
    var t = todayIso(), yd = new Date(); yd.setDate(yd.getDate() - 1);
    var y = yd.getFullYear() + '-' + pad(yd.getMonth() + 1) + '-' + pad(yd.getDate());
    var other = S.iso && S.iso !== t && S.iso !== y;
    var h = '<button type="button" class="chip" data-act="dv" data-v="' + t + '" aria-pressed="' + (S.iso === t) + '"><span>Сегодня<small>' + labelFromIso(t) + '</small></span></button>' +
      '<button type="button" class="chip" data-act="dv" data-v="' + y + '" aria-pressed="' + (S.iso === y) + '"><span>Вчера<small>' + labelFromIso(y) + '</small></span></button>' +
      '<label class="selwrap' + (other ? ' on' : '') + '"><input type="date" data-act="dpick" max="' + t + '" value="' + (other ? S.iso : '') + '" aria-label="Другая дата">' + I('chev') + '</label>';
    $('dateChips').innerHTML = h;
    $('dateFix').innerHTML = S.iso ? 'Списываем за <b>' + labelFromIso(S.iso) + '</b>' : 'Выберите дату смены, можно любую';
  }
  function redraw() {
    document.body.setAttribute('data-shift', S.shift);
    dateRow();
    $('shiftChips').innerHTML = [['day', 'Дневная'], ['night', 'Ночная']].map(function (x) {
      return '<button type="button" class="chip" data-act="shift" data-v="' + x[0] + '" aria-pressed="' + (S.shift === x[0]) + '">' + I(x[0] === 'day' ? 'sun' : 'moon') + x[1] + '</button>';
    }).join('');
    var q = num(S.qty);
    var h = '<div class="card-h"><span class="lbl">Списание</span></div><span class="field-l">Количество к списанию, куб</span>' +
      '<div class="step" style="border:0;padding:0"><span class="sl">' + I('aux') + 'Кубы</span><div class="stp"><button type="button" data-act="step" data-v="-1" aria-label="Минус">' + I('minus') + '</button>' +
      '<input data-num="dec" inputmode="decimal" data-act="qty" value="' + esc(S.qty) + '" placeholder="0" aria-label="Кубы к списанию">' +
      '<button type="button" data-act="step" data-v="1" aria-label="Плюс">' + I('plus') + '</button></div></div>';
    h += (!isNaN(q) && q > 0)
      ? '<div class="sentbar on" style="margin:14px 0 0">' + I('check') + 'Списание: ' + q + ' куб за ' + (S.shift === 'day' ? 'дневную' : 'ночную') + ' смену' + (S.iso ? ' ' + labelFromIso(S.iso) : '') + '. Итог пересчитается в таблице.</div>'
      : '<div class="pend" style="margin-top:14px">' + I('warn') + '<span>Укажите, сколько кубов дробины списываем.</span></div>';
    h += '<div class="pend" style="margin-top:10px">' + I('lock') + '<span>Время отправки фиксируется автоматически, в таблице встанет дата выбранной смены.</span></div>';
    $('qtyCard').innerHTML = h;
    $('bar').innerHTML = '<div class="prog">К списанию<b>' + (isNaN(q) ? 0 : q) + ' куб</b></div><button type="button" class="go" data-act="send" data-label="Отправить списание">' + I('check') + 'Отправить списание</button>';
  }
  // запрос по контракту: type drobina_utilization
  function build() {
    return { type: 'drobina_utilization', shift_date: S.iso, shift: S.shift, qty: outNum(S.qty), operator: FORM.operator, submit_date: todayIso(), secret: SECRET_TOKEN };
  }
  return {
    init: function () {
      render();
      document.addEventListener('click', function (e) {
        var t = e.target.closest('[data-act]'); if (!t || t.tagName === 'SELECT' || t.tagName === 'INPUT') return;
        var a = t.getAttribute('data-act'), v = t.getAttribute('data-v');
        if (a === 'dv') { S.iso = v; showErr(''); redraw(); }
        else if (a === 'shift') { S.shift = v; redraw(); }
        else if (a === 'step') { var q = num(S.qty); q = isNaN(q) ? 0 : q; S.qty = String(Math.max(0, q + (+v))); vibrate(); redraw(); }
        else if (a === 'send') {
          if (!S.iso) { showErr('Укажите дату смены'); return; }
          if (S.iso > todayIso()) { showErr('Дата смены не может быть позже сегодняшней'); return; }
          var q2 = num(S.qty);
          if (isNaN(q2) || q2 <= 0) { showErr('Укажите количество к списанию'); return; }
          showErr('');
          sendPayload(build(), $('bar').querySelector('.go'), function () {
            S.lastSent = nowHM(); var sent = q2, iso = S.iso, sh = S.shift;
            S.qty = ''; redraw();
            $('sentbar').classList.add('on');
            $('sentbar').innerHTML = I('check') + 'Списание отправлено в ' + S.lastSent + '. Можно списать ещё раз, форма остаётся открытой.';
            okScreen('Принято', 'Списание дробины <b>' + labelFromIso(iso) + '</b> · ' + (sh === 'day' ? 'дневная' : 'ночная') + ' смена<br>Списано: <b>' + sent + '</b> куб<br>' + FORM.operator + ', отправлено в <b>' + S.lastSent + '</b>',
              'Форма осталась открытой: можно списать ещё раз.' + (SEND_ENABLED ? '' : ' Это копия для осмотра: данные никуда не ушли.'));
          });
        }
      });
      document.addEventListener('change', function (e) { if (e.target.getAttribute('data-act') === 'dpick' && e.target.value) { S.iso = e.target.value; showErr(''); redraw(); } });
      document.addEventListener('input', function (e) {
        var t = e.target; if (t.getAttribute('data-act') !== 'qty') return;
        S.qty = t.value;
        var q = num(S.qty), el = $('bar').querySelector('.prog b'); if (el) el.textContent = (isNaN(q) ? 0 : q) + ' куб';
      });
      window.__state = S; window.__build = { drobina: build };
    }
  };
};

MODULES[FORM.module]().init();
bindNumericInputs(document);
</script>
</body>
</html>
